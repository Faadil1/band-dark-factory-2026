name: Pocketful Stage 1 Factory Run

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: pocketful-stage1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'pocketful/stage-1-run-')
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
      BAND_COORDINATOR_AGENT_ID: ${{ secrets.BAND_COORDINATOR_AGENT_ID }}
      BAND_COORDINATOR_API_KEY: ${{ secrets.BAND_COORDINATOR_API_KEY }}
      BAND_IMPLEMENTER_AGENT_ID: ${{ secrets.BAND_IMPLEMENTER_AGENT_ID }}
      BAND_IMPLEMENTER_API_KEY: ${{ secrets.BAND_IMPLEMENTER_API_KEY }}
      BAND_REVIEWER_AGENT_ID: ${{ secrets.BAND_REVIEWER_AGENT_ID }}
      BAND_REVIEWER_API_KEY: ${{ secrets.BAND_REVIEWER_API_KEY }}

    steps:
      - name: Checkout Stage 1 candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Initialize runtime paths
        shell: bash
        run: echo "KICKOFF=$RUNNER_TEMP/dark-factory-wearedevs" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone pinned official kickoff
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/band-ai/dark-factory-wearedevs.git "$KICKOFF"
          git -C "$KICKOFF" checkout 803560d2a678ace1414465c098eb0ab5380ffade
          test "$(git -C "$KICKOFF" rev-parse HEAD)" = "803560d2a678ace1414465c098eb0ab5380ffade"

      - name: Install official harness
        shell: bash
        run: python -m pip install -r "$KICKOFF/harness/requirements.txt"

      - name: Validate credentials
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BAND_COORDINATOR_AGENT_ID"
          test -n "$BAND_COORDINATOR_API_KEY"
          test -n "$BAND_IMPLEMENTER_AGENT_ID"
          test -n "$BAND_IMPLEMENTER_API_KEY"
          test -n "$BAND_REVIEWER_AGENT_ID"
          test -n "$BAND_REVIEWER_API_KEY"
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"

      - name: Prepare fresh BAND room and Stage 1 task
        id: prepare
        run: python infra/pocketful-stage1/stage1_pipeline.py prepare

      - name: Claude Implementer attempt 1
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Act as the Implementer seat for the real Pocketful Stage 1 factory run.
            Run token: ${{ steps.prepare.outputs.run_token }}
            Spec SHA256: ${{ steps.prepare.outputs.spec_sha256 }}

            Read the COMPLETE official Stage 1 requirements in pocketful-input/stage-1.md.
            Implement exactly Stage 1 under pocketful-result/stage-1/.

            Requirements:
            - source files, Dockerfile and RUN.md;
            - standalone single-container service;
            - preserve every written Stage 1 invariant, auth, idempotency, concurrency, reset,
              payment/request/split/settlement/feed/API/error contract;
            - do NOT intentionally implement Stage 2 behavior;
            - build to the written spec, not merely public tests;
            - modify ONLY pocketful-result/stage-1/;
            - do not modify inputs, state, evidence, workflows, mandates or any other path;
            - do not commit or push;
            - do not ask the human for clarification.
            Run bounded local checks when useful.
          claude_args: |
            --max-turns 64
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python:*),Bash(node:*),Bash(git diff:*),Bash(git status:*),Bash(find:*),Bash(mkdir:*),Bash(chmod:*),Bash(docker build:*),Bash(docker run:*),Bash(docker rm:*),Bash(curl:*)"

      - name: Validate and publish attempt 1
        id: publish1
        run: python infra/pocketful-stage1/stage1_pipeline.py publish 1 "${{ steps.prepare.outputs.initial_sha }}"

      - name: Independent Reviewer attempt 1
        id: review1
        run: python infra/pocketful-stage1/stage1_pipeline.py review 1 "${{ steps.publish1.outputs.revision }}"

      - name: Claude repair attempt 2
        if: steps.review1.outputs.verdict == 'REJECT'
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ steps.review1.outputs.repair_context }}
          claude_args: |
            --max-turns 44
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python:*),Bash(node:*),Bash(git diff:*),Bash(git status:*),Bash(find:*),Bash(docker build:*),Bash(docker run:*),Bash(docker rm:*),Bash(curl:*)"

      - name: Validate and publish attempt 2
        if: steps.review1.outputs.verdict == 'REJECT'
        id: publish2
        run: python infra/pocketful-stage1/stage1_pipeline.py publish 2 "${{ steps.publish1.outputs.revision }}"

      - name: Independent Reviewer attempt 2
        if: steps.review1.outputs.verdict == 'REJECT'
        id: review2
        run: python infra/pocketful-stage1/stage1_pipeline.py review 2 "${{ steps.publish2.outputs.revision }}"

      - name: Fail closed on unexpected pipeline failure
        if: failure()
        run: python infra/pocketful-stage1/stage1_pipeline.py block PIPELINE_FAILURE

      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketful-stage-1-${{ github.event.pull_request.number }}
          path: |
            artifacts/pocketful-stage-1/**
            ${{ runner.temp }}/pocketful-stage1-attempt-1/**
            ${{ runner.temp }}/pocketful-stage1-attempt-2/**
          if-no-files-found: warn
