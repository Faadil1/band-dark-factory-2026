name: BAND Remote Seat Collaboration

on:
  pull_request:
    paths:
      - "state/REMOTE-SEAT-COLLAB-TRIGGER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-collaboration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BAND_COORDINATOR_AGENT_ID: ${{ secrets.BAND_COORDINATOR_AGENT_ID }}
      BAND_COORDINATOR_API_KEY: ${{ secrets.BAND_COORDINATOR_API_KEY }}
      BAND_IMPLEMENTER_AGENT_ID: ${{ secrets.BAND_IMPLEMENTER_AGENT_ID }}
      BAND_IMPLEMENTER_API_KEY: ${{ secrets.BAND_IMPLEMENTER_API_KEY }}
      BAND_REVIEWER_AGENT_ID: ${{ secrets.BAND_REVIEWER_AGENT_ID }}
      BAND_REVIEWER_API_KEY: ${{ secrets.BAND_REVIEWER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all six secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BAND_COORDINATOR_AGENT_ID"
          test -n "$BAND_COORDINATOR_API_KEY"
          test -n "$BAND_IMPLEMENTER_AGENT_ID"
          test -n "$BAND_IMPLEMENTER_API_KEY"
          test -n "$BAND_REVIEWER_AGENT_ID"
          test -n "$BAND_REVIEWER_API_KEY"
          echo "All remote-seat credentials are present."

      - name: Authenticate all three agent identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/band"

          probe() {
            local label="$1"
            local id="$2"
            local key="$3"
            local out="$RUNNER_TEMP/band/${label}-me.json"
            local code

            code="$(curl --silent --show-error               --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"               --output "$out" --write-out "%{http_code}"               -H "X-API-Key: $key"               -H "Accept: application/json"               "https://app.band.ai/api/v1/agent/me")"

            if [ "$code" != "200" ]; then
              echo "$label identity probe failed with HTTP $code"
              cat "$out"
              exit 1
            fi

            python - "$label" "$id" "$out" <<'PY'
          import json, sys
          label, expected_id, path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          data = payload.get("data") or {}
          actual_id = str(data.get("id") or "")
          if actual_id != expected_id:
              raise SystemExit(f"{label}: returned agent id does not match configured id")
          print(f"{label}: REST identity OK; handle={data.get('handle')!r}; name={data.get('name')!r}")
          PY
          }

          probe coordinator "$BAND_COORDINATOR_AGENT_ID" "$BAND_COORDINATOR_API_KEY"
          probe implementer "$BAND_IMPLEMENTER_AGENT_ID" "$BAND_IMPLEMENTER_API_KEY"
          probe reviewer "$BAND_REVIEWER_AGENT_ID" "$BAND_REVIEWER_API_KEY"

      - name: Create BAND collaboration room as Coordinator
        id: room
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/band/create-room.json"
          CODE="$(curl --silent --show-error             --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"             --output "$OUT" --write-out "%{http_code}"             -X POST             -H "X-API-Key: $BAND_COORDINATOR_API_KEY"             -H "Accept: application/json"             -H "Content-Type: application/json"             -d '{}'             "https://app.band.ai/api/v1/agent/chats")"

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "Create room failed with HTTP $CODE"
            cat "$OUT"
            exit 1
          fi

          ROOM_ID="$(python - "$OUT" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          data = payload.get("data") or {}
          room_id = data.get("id") or data.get("chat_id") or data.get("room_id")
          if not room_id:
              raise SystemExit(f"No room id found in response keys={list(data.keys())}")
          print(room_id)
          PY
          )"

          echo "room_id=$ROOM_ID" >> "$GITHUB_OUTPUT"
          echo "Created BAND collaboration room."

      - name: Add Implementer and Reviewer participants
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
        run: |
          set -euo pipefail

          add_participant() {
            local label="$1"
            local participant_id="$2"
            local out="$RUNNER_TEMP/band/add-${label}.json"
            local code

            code="$(curl --silent --show-error               --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"               --output "$out" --write-out "%{http_code}"               -X POST               -H "X-API-Key: $BAND_COORDINATOR_API_KEY"               -H "Accept: application/json"               -H "Content-Type: application/json"               -d "{\"participant\":{\"participant_id\":\"${participant_id}\"}}"               "https://app.band.ai/api/v1/agent/chats/${ROOM_ID}/participants")"

            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Add $label failed with HTTP $code"
              cat "$out"
              exit 1
            fi
            echo "Added $label."
          }

          add_participant implementer "$BAND_IMPLEMENTER_AGENT_ID"
          add_participant reviewer "$BAND_REVIEWER_AGENT_ID"

      - name: Resolve participant handles
        id: handles
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/band/participants.json"
          CODE="$(curl --silent --show-error             --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"             --output "$OUT" --write-out "%{http_code}"             -H "X-API-Key: $BAND_COORDINATOR_API_KEY"             -H "Accept: application/json"             "https://app.band.ai/api/v1/agent/chats/${ROOM_ID}/participants")"

          if [ "$CODE" != "200" ]; then
            echo "List participants failed with HTTP $CODE"
            cat "$OUT"
            exit 1
          fi

          python - "$OUT" "$BAND_COORDINATOR_AGENT_ID" "$BAND_IMPLEMENTER_AGENT_ID" "$BAND_REVIEWER_AGENT_ID" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          path, coord_id, impl_id, review_id, output_path = sys.argv[1:]
          payload = json.load(open(path, encoding="utf-8"))
          data = payload.get("data") or []
          if isinstance(data, dict):
              data = data.get("participants") or data.get("items") or []
          by_id = {str(item.get("id") or item.get("participant_id") or ""): item for item in data}
          result = {}
          for key, expected in [("coordinator", coord_id), ("implementer", impl_id), ("reviewer", review_id)]:
              item = by_id.get(expected)
              if not item:
                  raise SystemExit(f"{key}: participant id not found in room")
              handle = item.get("handle")
              name = item.get("name")
              if not handle:
                  raise SystemExit(f"{key}: participant has no handle")
              if not str(handle).startswith("@"):
                  handle = "@" + str(handle)
              result[key] = (handle, name or key.title())
              print(f"{key}: participant present as {handle}")

          with open(output_path, "a", encoding="utf-8") as f:
              for key, (handle, name) in result.items():
                  f.write(f"{key}_handle={handle}\n")
                  f.write(f"{key}_name={name}\n")
          PY

      - name: Coordinator mentions Implementer
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
          IMPLEMENTER_HANDLE: ${{ steps.handles.outputs.implementer_handle }}
          IMPLEMENTER_NAME: ${{ steps.handles.outputs.implementer_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/band/coord-message.json"
          BODY="$(python - <<'PY'
          import json, os
          handle=os.environ["IMPLEMENTER_HANDLE"]
          name=os.environ["IMPLEMENTER_NAME"]
          print(json.dumps({
            "message": {
              "content": f"{handle} connectivity handoff from Coordinator: acknowledge this test.",
              "mentions": [{
                "id": os.environ["BAND_IMPLEMENTER_AGENT_ID"],
                "name": name,
                "handle": handle.lstrip("@")
              }]
            }
          }))
          PY
          )"

          CODE="$(curl --silent --show-error             --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"             --output "$OUT" --write-out "%{http_code}"             -X POST             -H "X-API-Key: $BAND_COORDINATOR_API_KEY"             -H "Accept: application/json"             -H "Content-Type: application/json"             -d "$BODY"             "https://app.band.ai/api/v1/agent/chats/${ROOM_ID}/messages")"

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "Coordinator message failed with HTTP $CODE"
            cat "$OUT"
            exit 1
          fi
          echo "Coordinator -> Implementer message posted."

      - name: Implementer replies to Coordinator
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
          COORDINATOR_HANDLE: ${{ steps.handles.outputs.coordinator_handle }}
          COORDINATOR_NAME: ${{ steps.handles.outputs.coordinator_name }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/band/impl-message.json"
          BODY="$(python - <<'PY'
          import json, os
          handle=os.environ["COORDINATOR_HANDLE"]
          name=os.environ["COORDINATOR_NAME"]
          print(json.dumps({
            "message": {
              "content": f"{handle} Implementer acknowledges the connectivity handoff.",
              "mentions": [{
                "id": os.environ["BAND_COORDINATOR_AGENT_ID"],
                "name": name,
                "handle": handle.lstrip("@")
              }]
            }
          }))
          PY
          )"

          CODE="$(curl --silent --show-error             --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"             --output "$OUT" --write-out "%{http_code}"             -X POST             -H "X-API-Key: $BAND_IMPLEMENTER_API_KEY"             -H "Accept: application/json"             -H "Content-Type: application/json"             -d "$BODY"             "https://app.band.ai/api/v1/agent/chats/${ROOM_ID}/messages")"

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "Implementer reply failed with HTTP $CODE"
            cat "$OUT"
            exit 1
          fi
          echo "Implementer -> Coordinator reply posted."

      - name: Verify reciprocal messages from Coordinator context
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/band/context.json"
          CODE="$(curl --silent --show-error             --user-agent "BAND-Dark-Factory-2026-GitHub-Actions/1.0"             --output "$OUT" --write-out "%{http_code}"             -H "X-API-Key: $BAND_COORDINATOR_API_KEY"             -H "Accept: application/json"             "https://app.band.ai/api/v1/agent/chats/${ROOM_ID}/context")"

          if [ "$CODE" != "200" ]; then
            echo "Context verification failed with HTTP $CODE"
            cat "$OUT"
            exit 1
          fi

          python - "$OUT" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          raw = json.dumps(payload)
          required = [
              "connectivity handoff from Coordinator",
              "Implementer acknowledges the connectivity handoff",
          ]
          missing = [needle for needle in required if needle not in raw]
          if missing:
              raise SystemExit(f"Missing reciprocal message evidence: {missing}")
          print("Reciprocal Coordinator <-> Implementer @handle exchange: PROVEN")
          PY

      - name: Write safe evidence summary
        if: always()
        shell: bash
        env:
          ROOM_ID: ${{ steps.room.outputs.room_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cat > "$RUNNER_TEMP/evidence/summary.txt" <<EOF
          BAND remote-seat collaboration probe
          room_id=${ROOM_ID:-unknown}
          no_llm=true
          product_code_started=false
          EOF

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: band-remote-seat-collaboration
          path: ${{ runner.temp }}/evidence/**
          if-no-files-found: warn
