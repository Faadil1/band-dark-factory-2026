name: Toy Factory Pipeline Static Check

on:
  pull_request:
    paths:
      - ".github/workflows/toy-factory-rehearsal-*.yml"
      - "infra/toy-rehearsal/**"
      - ".github/workflows/pocketful-stage-2-dispatch.yml"
      - "infra/pocketful-stage2/**"
      - ".github/workflows/pocketful-stage-3-dispatch.yml"
      - "infra/pocketful-stage3/**"
      - ".github/workflows/pocketful-stage-4-dispatch.yml"
      - "infra/pocketful-stage4/**"
      - ".github/workflows/pocketful-final-submission-run.yml"
      - "infra/pocketful-final-run/**"
      - "submission-final/templates/**"
      - "state/CURRENT.yaml"
      - "state/HANDOVER.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/toy-factory-rehearsal-dispatch.yml .github/workflows/toy-factory-rehearsal-review.yml .github/workflows/pocketful-stage-2-dispatch.yml .github/workflows/pocketful-stage-3-dispatch.yml .github/workflows/pocketful-stage-4-dispatch.yml .github/workflows/pocketful-final-submission-run.yml

      - name: Compile Toy transport scripts
        run: |
          python -m py_compile \
            infra/toy-rehearsal/dispatch.py \
            infra/toy-rehearsal/review.py \
            infra/toy-rehearsal/claude_pipeline.py \
            infra/pocketful-stage2/claude_pipeline.py \
            infra/pocketful-stage3/claude_pipeline.py \
            infra/pocketful-stage4/claude_pipeline.py \
            infra/pocketful-final-run/pipeline.py

      - name: Assert transport invariants
        shell: python
        run: |
          from pathlib import Path

          dispatch_workflow = Path(".github/workflows/toy-factory-rehearsal-dispatch.yml").read_text()
          review_workflow = Path(".github/workflows/toy-factory-rehearsal-review.yml").read_text()
          dispatch = Path("infra/toy-rehearsal/dispatch.py").read_text()
          review = Path("infra/toy-rehearsal/review.py").read_text()
          current = Path("state/CURRENT.yaml").read_text()
          handover = Path("state/HANDOVER.yaml").read_text()

          assert "types: [opened, reopened]" in dispatch_workflow
          assert "synchronize" not in dispatch_workflow
          assert "id-token: write" in dispatch_workflow
          assert "CLAUDE_CODE_OAUTH_TOKEN" in dispatch_workflow
          assert "anthropics/claude-code-action@" in dispatch_workflow
          assert "Claude Implementer attempt 1" in dispatch_workflow
          assert "Claude repair attempt 2" in dispatch_workflow
          assert "steps.review1.outputs.verdict == 'REJECT'" in dispatch_workflow
          assert "claude_pipeline.py publish 1" in dispatch_workflow
          assert "claude_pipeline.py review 2" in dispatch_workflow
          assert "CODEX_GITHUB_USER_TOKEN" not in dispatch_workflow

          assert "toy/rehearsal-1" not in review_workflow
          assert "toy/rehearsal-[0-9]*" in review_workflow
          assert "cancel-in-progress: false" in review_workflow

          claude = Path("infra/toy-rehearsal/claude_pipeline.py").read_text()
          assert "TOY_IMPLEMENTER_RUNTIME=CLAUDE_CODE_OAUTH" in claude
          assert "TOY_REPAIR_REQUESTED" in claude
          assert "runtime=CLAUDE_CODE_OAUTH" in claude
          assert "--force-with-lease" in claude
          assert "human_steering_after_pr_open" in claude
          assert '"--untracked-files=all"' in claude
          assert 'allowed=re.compile(r"^toy-result/stage-[1-4]/.+")' in claude

          # Legacy Codex transport remains retained for historical evidence only.
          assert "CODEX_TRANSPORT_TIMEOUT" in dispatch
          assert "validate_codex_user_token" in dispatch
          assert 're.fullmatch(r"toy/rehearsal-(\\d+)", branch)' in dispatch

          assert 'f"HEAD:{branch}"' in review
          assert "NOOP_ALREADY_TERMINAL" in review
          assert "TOY_REHEARSAL_TERMINAL" in review

          stage2 = Path("infra/pocketful-stage2/claude_pipeline.py").read_text()
          stage2_workflow = Path(".github/workflows/pocketful-stage-2-dispatch.yml").read_text()
          assert '"--stage","2","--mode","isolated"' in stage2
          assert '"--stage","1","--mode","isolated"' not in stage2
          assert "Pocketful Stage 2 Factory Run" in stage2_workflow
          assert "steps.review1.outputs.verdict == 'REJECT'" in stage2_workflow
          assert "Claude repair attempt 2" in stage2_workflow

          stage3 = Path("infra/pocketful-stage3/claude_pipeline.py").read_text()
          stage3_workflow = Path(".github/workflows/pocketful-stage-3-dispatch.yml").read_text()
          assert '"--stage","3","--mode","isolated"' in stage3
          assert '"--stage","2","--mode","isolated"' not in stage3
          assert "pocketful-input/stage-1.md" in stage3
          assert "pocketful-input/stage-2.md" in stage3
          assert "pocketful-input/stage-3.md" in stage3
          assert "Pocketful Stage 3 Factory Run" in stage3_workflow
          assert "pocketful/stage-3-run-" in stage3_workflow
          assert "steps.review1.outputs.verdict == 'REJECT'" in stage3_workflow
          assert "Claude repair attempt 2" in stage3_workflow

          stage4 = Path("infra/pocketful-stage4/claude_pipeline.py").read_text()
          stage4_workflow = Path(".github/workflows/pocketful-stage-4-dispatch.yml").read_text()
          assert '"--stage","4","--mode","isolated"' in stage4
          assert '"--stage","3","--mode","isolated"' not in stage4
          assert "pocketful-input/stage-1.md" in stage4
          assert "pocketful-input/stage-2.md" in stage4
          assert "pocketful-input/stage-3.md" in stage4
          assert "pocketful-input/stage-4.md" in stage4
          assert "Pocketful Stage 4 Factory Run" in stage4_workflow
          assert "pocketful/stage-4-run-" in stage4_workflow
          assert "steps.review1.outputs.verdict == 'REJECT'" in stage4_workflow
          assert "Claude repair attempt 2" in stage4_workflow

          final_pipe = Path("infra/pocketful-final-run/pipeline.py").read_text()
          final_workflow = Path(".github/workflows/pocketful-final-submission-run.yml").read_text()
          assert "Pocketful Final One-Room Four-Stage Run" in final_workflow
          assert "submission/pocketful-final-run-" in final_workflow
          assert ("ref: $" + "{{ github.event.pull_request.head.sha }}") in final_workflow
          assert "rm -rf pocketful-result submission-final-runtime" in final_workflow
          assert "Prepare one fresh room and one fresh result repository" in final_workflow
          for stage in range(1, 5):
              assert f"Begin Stage {stage}" in final_workflow
              assert f"Claude Stage {stage} attempt 1" in final_workflow
              assert f"Gate Stage {stage}" in final_workflow
          assert 'git("init","-b","main")' in final_pipe
          assert 'curl_json("POST",f"{BAND_BASE}/chats"' in final_pipe
          assert 'submission-final-runtime' in final_pipe
          assert 'fresh-result-before-room.bundle' in final_pipe
          assert "PRODUCT_COMPLETE_AWAITING_AUTHENTIC_ROOM_JSON" in final_pipe
          assert 'room.json").write' not in final_pipe
          assert 'room.json").write_text' not in final_pipe
          assert "room.json is missing" in final_pipe
          assert "human_steering_after_trigger" in final_pipe
          assert not Path("submission-final-runtime/result").exists()
          assert "next_fresh_rehearsal:" in current
          assert "transport_hardening_pr: 37" in handover
          assert "user_authored_codex_dispatch: PROVEN_IN_REHEARSAL_4" in current
